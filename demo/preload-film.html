<!doctype html><html lang="en"><meta charset="utf-8"><title>Every action. In detail.</title>
<style>
@font-face{font-family:Display;src:url(fonts/Display-Medium.otf);font-weight:500}
@font-face{font-family:Display;src:url(fonts/Display-SemiBold.otf);font-weight:600}
@font-face{font-family:Mono;src:url(fonts/Mono-Regular.ttf)}
*{box-sizing:border-box}body{margin:0;background:#0b0e0d;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}
#controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#25312ce8;border:1px solid #ffffff28;padding:10px 18px;border-radius:12px;color:white;font:13px Mono}
button{border:0;background:#d2fa69;border-radius:6px;padding:8px 14px;cursor:pointer}input{width:360px;accent-color:#d2fa69}
</style><canvas width="1920" height="1080" id="film"></canvas><div id="controls"><button id="play">Play</button><input id="scrub" type="range" min="0" max="29.999" step=".01" value="0"><span id="tc">00.00 / 30.00</span></div>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const C={bg:'#0b0f0e',panel:'#151c18',line:'#303a32',ink:'#f0f1e9',muted:'#9ea99f',accent:'#d2fa69',paper:'#efefe7',dark:'#162018',soft:'#dfe1d6',orange:'#f4c98c'};
let DATA;const images=new Map(),W=1280,H=720,FPS=30,DURATION=30;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>1-Math.pow(1-clamp(x),4);
const mix=(a,b,p)=>a+(b-a)*p;
function font(size=24,weight=500,mono=false){ctx.font=`${weight} ${size}px ${mono?'Mono':'Display'}`;ctx.textBaseline='alphabetic';}
function txt(s,x,y,size=24,color=C.ink,weight=500,align='left',mono=false){font(size,weight,mono);ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left';}
function rule(x,y,w,color=C.line){ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();}
function rect(x,y,w,h,r=0,fill=C.panel,stroke=null){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.lineWidth=1;ctx.strokeStyle=stroke;ctx.stroke();}}
function alpha(a,fn){ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore();}
function reveal(t,delay,fn){let p=ease((t-delay)/.8);ctx.save();ctx.globalAlpha*=p;ctx.translate(0,(1-p)*22);fn(p);ctx.restore();}
function lines(s,x,y,width,size=28,color=C.ink,weight=500,lineHeight=1.25){font(size,weight);let rows=[],line='';for(const word of s.split(' ')){let n=line?line+' '+word:word;if(ctx.measureText(n).width>width&&line){rows.push(line);line=word;}else line=n;}if(line)rows.push(line);rows.forEach((r,i)=>txt(r,x,y+i*size*lineHeight,size,color,weight));return rows.length;}
function label(s,x,y,color=C.muted,size=14){txt(s,x,y,size,color,500,'left',true);}
function shell(t,name,light=false){const ink=light?C.dark:C.ink,muted=light?'#667365':C.muted;ctx.fillStyle=light?C.paper:C.bg;ctx.fillRect(0,0,W,H);label('EGOCENTRIC VIDEO',64,51,muted,13);ctx.fillStyle=muted;ctx.textAlign='right';font(13,500,true);ctx.fillText(name,1216,51);ctx.textAlign='left';// clean top rule
rule(64,79,1152,light?'#cfd4c8':'#28312a');
rect(64,695,1152,2,0,light?'#d0d5c9':'#263129');rect(64,695,1152*clamp(t/DURATION),2,0,light?'#334b28':C.accent);
}
function footer(left,right='',light=false){label(left,64,670,light?'#687164':C.muted,13);if(right)txt(right,1216,670,13,light?'#687164':C.muted,500,'right',true);}
async function img(sid,t){const f=Math.min(719,Math.max(0,Math.floor(t*30))),key=sid+'/'+f;if(!images.has(key)){const im=new Image();im.src=`../artifacts/demo/frames/${sid}/${String(f).padStart(3,'0')}.jpg`;images.set(key,im.decode().then(()=>im));if(images.size>100)images.delete(images.keys().next().value);}return images.get(key);}
function video(im,x,y,w,h){ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.clip();ctx.drawImage(im,x,y,w,h);ctx.restore();rect(x,y,w,h,12,null,'#465342');}
function pill(s,x,y,{fill=C.accent,ink=C.dark,size=13,pad=12}={}){font(size,500,true);const w=ctx.measureText(s).width+pad*2;rect(x,y-22,w,33,16,fill);txt(s,x+pad,y,size,ink,500,'left',true);return w;}
function capAt(id,t){return DATA.captions[id].find(c=>t>=c.start_ts&&t<c.end_ts);}
function stamp(s){return s.toFixed(2).padStart(5,'0');}
const colors=['#d2fa69','#9ac9aa','#83b6b6','#acb895'];
function ribbon(id,t,x,y,w,compact=false){const caps=DATA.captions[id],dur=24;for(let i=0;i<caps.length;i++){const c=caps[i],on=t>=c.start_ts&&t<c.end_ts;const a=x+c.start_ts/dur*w,b=(c.end_ts-c.start_ts)/dur*w-3;rect(a,y,b,compact?17:26,3,on?C.accent:colors[i%4]);if(!compact){ctx.save();ctx.beginPath();ctx.rect(a,y,b,26);ctx.clip();txt(c.verb.toUpperCase(),a+7,y+17,10,C.dark,600,'left',true);ctx.restore();}}if(t>=0){ctx.fillStyle=C.ink;ctx.fillRect(x+t/dur*w-1,y-7,2,compact?31:40);}if(!compact)for(let i=0;i<=24;i+=4){const a=x+i/24*w;label(String(i).padStart(2,'0')+'s',a-(i===24?24:0),y+48,C.muted,11);}}
function contextRow(c,n,x,y,w){if(!c)return;label(String(n+1).padStart(2,'0'),x,y+18,C.muted,11);txt(c.verb.charAt(0).toUpperCase()+c.verb.slice(1)+' / '+c.noun,x+33,y+19,18,'#b5bfb1');label(stamp(c.start_ts)+'–'+stamp(c.end_ts)+' s',x+33,y+41,'#778776',11);rule(x,y+56,w,'#29362b');}
function annotationPanel(id,st,x,y,w,h){const caps=DATA.captions[id],index=caps.findIndex(c=>st>=c.start_ts&&st<c.end_ts),c=caps[index];rect(x,y,w,h,12,C.panel,C.line);label('DENSE ANNOTATIONS',x+22,y+31,C.accent,12);txt(String(index+1).padStart(2,'0')+' / '+caps.length,x+w-22,y+31,12,C.muted,500,'right',true);rule(x+22,y+48,w-44);contextRow(id==='epic-cook'&&caps[index-1]?.start_ts<13.812?null:caps[index-1],index-1,x+22,y+62,w-44);if(c){const a=ease((st-c.start_ts)/.25);ctx.save();ctx.translate(0,(1-a)*8);rect(x+14,y+139,w-28,186,9,'#d2fa69');label(stamp(c.start_ts)+' — '+stamp(c.end_ts)+' s',x+29,y+164,'#456031',12);txt(c.verb.toUpperCase(),x+28,y+206,32,C.dark,600);lines(c.text,x+29,y+239,w-58,21,C.dark,500,1.23);ctx.restore();}contextRow(caps[index+1],index+1,x+22,y+345,w-44);}
async function intro(t){shell(t,'HIGH-DENSITY EGO ANNOTATIONS');const st=18+t,im=await img('epic-cook',st);video(im,412,125,804,452.25);const g=ctx.createLinearGradient(260,0,890,0);g.addColorStop(0,C.bg);g.addColorStop(.5,'#0b0f0eee');g.addColorStop(1,'#0b0f0e00');ctx.fillStyle=g;ctx.fillRect(64,124,1000,455);reveal(t,0,()=>{label('FROM VIDEO TO TRAINING DATA',64,169,C.accent,13);txt('Every action.',60,276,81,C.ink,600);txt('In detail.',60,369,88,C.accent,600);});reveal(t,.35,()=>lines('Dense captions. Precise timestamps.\nStructured output.',65,435,480,27,C.ink,500,1.4));reveal(t,.65,()=>{ribbon('epic-cook',st,64,597,1152,true);label('ACTION',64,638,C.muted,12);label('OBJECT',256,638,C.muted,12);label('TIME',448,638,C.muted,12);txt('REAL RGB INPUT → SAVED MODEL OUTPUT',1216,638,12,C.muted,500,'right',true);});footer('DENSE ANNOTATION PIPELINE','Color footage: EPIC-KITCHENS');}
async function live(t,id,st,heading){shell(t,'VIDEO → CAPTIONS → STRUCTURED DATA');txt(heading,64,127,35,C.ink,600);const im=await img(id,st);video(im,64,155,744,418.5);pill('RGB / 1×',80,186,{fill:'#0b1513e0',ink:C.ink,size:11});pill(stamp(st)+' s',696,186,{fill:'#0b1513e0',ink:C.ink,size:11});annotationPanel(id,st,832,155,384,418.5);label('TIME-ALIGNED ACTION SPANS',64,590,C.muted,11);label('ACTION / OBJECT / CAPTION',832,590,C.muted,11);ribbon(id,st,64,602,1152);footer('EPIC-KITCHENS / '+(id==='epic-prep'?'Preparation':'Cutting')+' excerpt','Actual pipeline output · edited presentation');}
async function quality(t){const u=t-22,q=DATA.quality;shell(t,'EGO VIDEO QUALITY');reveal(u,0,()=>{txt('Ego quality. With evidence.',64,146,54,C.ink,600);});const evidenceTime=u<4?q.evidence.frame_s:q.evidence.glare_frame_s;const im=await img(q.evidence.clip,evidenceTime);reveal(u,.15,()=>{video(im,64,197,552,310.5);pill('EVIDENCE FRAME / '+stamp(evidenceTime)+'s',80,230,{fill:'#0b1513e8',ink:C.ink,size:11});});reveal(u,.35,()=>{rect(648,197,568,310.5,12,C.panel,C.line);label('SAMPLED VISUAL OBSERVATIONS',674,230,C.accent,12);label('HAND VISIBILITY',674,270,u<4?C.accent:C.muted,12);txt('Partial hand cropping',674,308,32,C.ink,600);txt('During drawer access · '+q.evidence.hand_time,676,341,20,C.muted);rule(674,363,516);label('VISUAL QUALITY',674,392,u>=4?C.accent:C.muted,12);txt('Possible faucet glare',674,428,28,C.ink,600);label(q.evidence.glare_time,676,466,C.muted,14);});reveal(u,.65,()=>{const stats=[[q.frames.toLocaleString(),'frames decoded'],[Math.round(q.overall_score_percent)+'%','estimated overall quality'],[String(q.clips),'clips analyzed']];stats.forEach(([value,caption],i)=>{let x=64+i*392;rect(x,543,368,88,9,i===1?C.accent:'#1d2920');txt(value,x+20,587,39,i===1?C.dark:C.accent,600);txt(caption,x+22,615,17,i===1?C.dark:C.ink);});});footer('Combined estimate · blur, exposure, motion, visibility + scene clarity','48-second sample / EPIC-KITCHENS');if(u>7.5)alpha((u-7.5)/.5,()=>{ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);});}
window.render=async function(t){await window.ready;ctx.setTransform(1.5,0,0,1.5,0,0);ctx.globalAlpha=1;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(t<3)await intro(t);else if(t<17)await live(t,'epic-prep',t+7,'Every interaction, on the timeline.');else if(t<22)await live(t,'epic-cook',t-2,'The detail lives between the big actions.');else await quality(t);};
window.ready=(async()=>{await document.fonts.ready;await Promise.all([document.fonts.load('500 24px Display'),document.fonts.load('600 24px Display'),document.fonts.load('500 18px Mono')]);DATA=await fetch('../artifacts/demo/film-data.json').then(r=>r.json());if(!Number.isFinite(DATA.quality?.overall_score_percent))throw new Error('Combined quality score is unavailable.');})();
if(location.search.includes('render=1'))document.querySelector('#controls').style.display='none';
let playing=false,current=0,last=0,busy=false;const scrub=document.querySelector('#scrub'),button=document.querySelector('#play');
async function paint(t){await window.render(t);scrub.value=t;document.querySelector('#tc').textContent=t.toFixed(2)+' / 30.00';}
button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play';last=performance.now();};scrub.oninput=()=>{current=Number(scrub.value);playing=false;button.textContent='Play';paint(current);};
async function tick(now){if(playing&&!busy){busy=true;current=(current+(now-last)/1000)%DURATION;last=now;await paint(current);busy=false;}requestAnimationFrame(tick);}
window.ready.then(()=>paint(0));requestAnimationFrame(tick);
</script></html>
